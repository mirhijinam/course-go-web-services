syntax = "proto3";

// old: protoc --go_out=plugins=grpc:. *.proto
// new: protoc --go_out=. --go-grpc_out=. translit/*.proto

package translit;

option go_package = "./translit";

message Word {
  string Word = 1;
}

// grpc-сервис транслитерации
service Transliteration {
    rpc EnRu (stream Word) returns (stream Word) {}
}

